<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCIM Indoor Map — корпус №3 UTM</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1d2733; --muted:#6b7785; --line:#dfe4ea;
    --accent:#0f7b5f; --accent-soft:#e3f3ee; --warn:#b35c00; --warn-soft:#fff3e2; --danger:#b42318;
    --room:#dce8dc; --room-service:#f1f2f0; --corridor:#f1f2f0; --wall:#38434f;
    --map-wall-width:2px; --map-wall-color:#38434f; --wc:#e4e1d9; --cafe:#eee3d2; --reception:#e6e6e1;
    --stair:#d4dee3; --lift:#b7cddd;
    --sel:#0f7b5f; --sel-fill:#c9ecdf; --bound:#e9f7f1; --scheduled:#dbeafe; --mine:#a7e7ce;
    --radius:14px; --shadow:0 6px 24px rgba(20,30,45,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select{font:inherit;color:inherit}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{display:flex;gap:10px;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
  .brand b{font-size:16px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--muted)}
  .search{display:flex;flex:1 1 260px;max-width:440px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .search input{flex:1;border:0;background:transparent;padding:9px 12px;outline:none;min-width:0}
  .search button{border:0;background:var(--accent);color:#fff;padding:0 14px;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c5ced8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
  .btn .ic{margin-right:6px}
  .zoom .ic{width:20px;height:20px;vertical-align:middle}
  main{position:relative;flex:1;min-height:0;display:flex}
  .mapwrap{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none;
    background:#fafbf9}
  svg#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .floors{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5;
    background:var(--panel);padding:6px;border-radius:14px;box-shadow:var(--shadow)}
  .floors button{width:44px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-weight:600}
  .floors button.active{background:var(--accent);color:#fff}
  .floors button.pending{color:#a9b2bc;cursor:not-allowed;font-weight:500}
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoom button{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);box-shadow:var(--shadow);font-size:20px;cursor:pointer}
  .floorbadge{position:absolute;left:12px;top:12px;z-index:5;background:var(--panel);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);max-width:min(460px,calc(100% - 90px))}
  .floorbadge b{font-size:18px}
  .floorbadge .meta{font-size:12px;color:var(--muted)}
  .floorbadge details{font-size:12.5px;margin-top:4px}
  .floorbadge summary{cursor:pointer;color:var(--accent)}
  .floorbadge ul{margin:6px 0 0;padding-left:18px}
  .mode-banner{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;background:var(--ink);color:#fff;
    padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);display:none;white-space:nowrap}
  .mode-banner.show{display:block}
  aside.sheet{width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .card h3{margin:0 0 8px;font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
  dl.kv dt{color:var(--muted)}
  dl.kv dd{margin:0;word-break:break-word}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
  .pill.ok{background:var(--accent-soft);border-color:#a8dcc9;color:var(--accent)}
  .pill.warn{background:var(--warn-soft);border-color:#f3c98f;color:var(--warn)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .editor input{flex:1;min-width:120px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  .msg{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--bg)}
  .msg.err{background:#fdecea;color:var(--danger)}
  .msg.ok{background:var(--accent-soft);color:var(--accent)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .legend{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;align-items:center;font-size:13px}
  .sw{width:20px;height:14px;border-radius:3px;border:1.5px solid var(--wall)}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;
    z-index:50;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  .grip{display:none}
  #panel,#scheduleSummary,.schedule-controls{flex:none}
  .schedule-controls p{margin:8px 0}
  .schedule-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .schedule-fields label,.period-label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
  .schedule-fields input,.schedule-fields select,.period-label select{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px}
  #scheduleContext{margin-top:8px}
  [hidden]{display:none!important}
  #sourceStatus,.lesson{overflow-wrap:anywhere}
  #apiBaseInput{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px}
  #scheduleSummary .card{margin:0}
  .lesson{margin:10px 0;padding:9px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;font-size:13px}
  .lesson p{margin:3px 0}
  .schedule-room{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .demo-label{fill:#145e9c;stroke:#fff}
  /* UI-01: fills/hit regions and the deduplicated wall network are separate. */
  .outline,.corr{fill:var(--corridor);stroke:none}
  .sp,.vert .box,.lift-cell,.logical-fill{stroke:none;stroke-dasharray:none;cursor:pointer}
  .sp{transition:fill .12s}
  .sp,.vert{-webkit-tap-highlight-color:transparent}
  .sp:focus,.vert:focus{outline:none}
  .sp:focus-visible,.vert:focus-visible{outline:2px solid var(--sel);outline-offset:-4px}
  .sp.t-unknown,.sp.t-classroom,.sp.t-office,.sp.bound,.logical-fill{fill:var(--room)}
  .sp.t-service{fill:var(--room-service)}
  .sp.t-circulation{fill:var(--corridor)}
  .room01-floor .sp.t-circulation{pointer-events:none}
  .sp[data-facility="toilet"]{fill:var(--wc)}
  .sp[data-facility="cafe"]{fill:var(--cafe)}
  .sp[data-facility="reception"],.vert.integrated .box{fill:var(--reception)}
  .sp[data-facility="storage"],.vert.integrated-hidden .box{fill:var(--room-service);pointer-events:none}
  .vert.integrated-hidden{pointer-events:none}
  .sp:hover{fill:#c7dfce}
  .sp.sel,.logical-fill.sel{fill:var(--sel-fill)!important}
  .sp.scheduled-other,.logical-fill.scheduled-other{fill:var(--scheduled)}
  .sp.scheduled-mine,.logical-fill.scheduled-mine{fill:var(--mine)}
  .sp.schedule-next,.logical-fill.schedule-next{fill:#eefbf6}
  .sp.sel.scheduled-other,.logical-fill.sel.scheduled-other{fill:var(--scheduled)!important}
  .sp.sel.scheduled-mine,.logical-fill.sel.scheduled-mine{fill:var(--mine)!important}
  .sp.sel.schedule-next,.logical-fill.sel.schedule-next{fill:#eefbf6!important}
  .sp.flash{animation:flash 1.1s ease-in-out 2}
  @keyframes flash{50%{fill:#9ddcc5}}
  .vert.stair .box{fill:var(--stair)}
  .vert.elevator .box,.vert.shaft .box,.lift-cell{fill:var(--lift)}
  .vert.integrated .box{fill:var(--reception)}
  .vert.integrated-hidden .box{fill:var(--room-service)}
  .vert.sel .box{fill:var(--sel-fill)}
  .map-walls{fill:none;stroke:var(--map-wall-color);stroke-width:var(--map-wall-width);stroke-linecap:butt;stroke-linejoin:miter;vector-effect:non-scaling-stroke;pointer-events:none}
  .logical-outline{fill:none;stroke:var(--sel);stroke-width:var(--map-wall-width);stroke-linejoin:miter;vector-effect:non-scaling-stroke;pointer-events:none}
  .logical-outline.schedule-shared{stroke:#b35c00}
  .logical-outline.schedule-next{stroke:var(--accent);stroke-dasharray:6 3}
  .lbl{font-size:10.5px;font-weight:600;fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:central;stroke:none}
  .room01-floor [data-room-label]{font-size:10px;font-family:inherit;font-weight:600;fill:var(--ink);text-anchor:start;dominant-baseline:hanging}
  .lbl.hall{font-size:7px;font-weight:500;fill:var(--muted)}
  .entrance-label{font-size:12px;font-weight:600;fill:var(--accent);pointer-events:none}
  .demo-label{fill:#145e9c}
  @media (max-width:900px){
    main{flex-direction:column}
    .mapwrap{min-height:0}
    aside.sheet{position:relative;width:100%;height:46%;flex:0 0 46%;min-height:56px;max-height:none;border-left:0;border-top:1px solid var(--line);
      border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(20,30,45,.10);z-index:20;padding:10px 14px max(14px,env(safe-area-inset-bottom));transition:flex-basis .25s,height .25s}
    aside.sheet.collapsed{height:56px;flex-basis:56px;overflow:hidden}
    .grip{display:block;position:sticky;top:0;z-index:2;width:100%;height:30px;border:0;border-radius:8px;background:#f4f6f8;color:var(--muted);margin:0;cursor:pointer;flex:none;font-size:12px}
    .zoom{bottom:auto;top:12px;right:68px;flex-direction:row}
    .zoom button{width:40px;height:40px}
    .floors{top:auto;bottom:8px;left:12px;right:12px;flex-direction:row;justify-content:space-between;gap:2px}
    .floors button{width:calc((100% - 14px)/8);height:34px}
    .floorbadge{top:12px;bottom:auto;max-width:calc(100% - 166px);padding:6px 8px}
    .floorbadge .meta{display:none}
    .floorbadge b{font-size:14px}
    .floorbadge details{font-size:11px}
    header{gap:8px;padding:8px 10px}
    .brand span{display:none}
    .search{order:3;flex-basis:100%;max-width:none}
    header .tools{flex-wrap:nowrap}
    header .tools .btn{padding:7px 9px;font-size:13px}
    header .tools .btn span{display:none}
    header .tools .btn .ic{margin-right:0}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>FCIM · Корпус №3 UTM</b><span id="appSubtitle">Академическая карта · синтетическое расписание</span></div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" inputmode="text" placeholder="Аудитория: 3-405 или 405" aria-label="Поиск аудитории">
      <button type="submit" aria-label="Найти">Найти</button>
    </form>
    <div class="tools">
      <button class="btn" id="editToggle" aria-pressed="false" title="Режим ручной привязки номеров"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg><span>Разметка</span></button>
      <button class="btn" id="exportBtn" title="Экспорт привязок в JSON"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Экспорт</span></button>
      <button class="btn" id="importBtn" title="Импорт привязок из JSON"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg><span>Импорт</span></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>
  <main>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="План этажа">
        <defs></defs>
        <g id="layerBase"></g><g id="layerSpaces"></g><g id="layerVert"></g><g id="layerWalls" pointer-events="none"></g><g id="layerDoors"></g>
        <g id="layerFeat"></g><g id="layerLabels"></g>
      </svg>
      <div class="floorbadge" id="floorBadge"></div>
      <nav class="floors" id="floorNav" aria-label="Этажи"></nav>
      <div class="zoom">
        <button id="zoomIn" aria-label="Приблизить">+</button>
        <button id="zoomOut" aria-label="Отдалить">−</button>
        <button id="zoomReset" aria-label="Сбросить масштаб"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="mode-banner" id="modeBanner"></div>
    </div>
    <aside class="sheet" id="sheet">
      <button class="grip" id="grip" aria-expanded="true" aria-label="Свернуть или развернуть панель">Расписание и помещение ↕</button>
      <div class="card schedule-controls" id="scheduleControls">
        <label class="period-label">Источник<select id="sourceSelect"><option value="real">Реальное расписание FCIM</option><option value="demo">Демо · синтетическое расписание</option></select></label>
        <div class="pill warn" id="demoQualification">Синтетическое демо · не расписание UTM</div>
        <p class="small muted" id="demoDescription">Планируемые занятия, а не посещаемость. Номера демо не проверены на месте.</p>
        <p class="small muted" id="liveQualification" hidden></p>
        <div id="liveSourceControls" hidden><div class="schedule-fields"><label>Курс<select id="courseSelect"><option value="1">Anul I</option><option value="2">Anul II</option></select></label><button class="btn" id="refreshTimetable" type="button">Обновить расписание</button></div></div>
        <div class="row modes" aria-label="Режим расписания">
          <button class="btn on" id="myMode" aria-pressed="true">Моя группа</button>
          <button class="btn" id="allMode" aria-pressed="false">Все занятия</button>
        </div>
        <div class="schedule-fields">
          <label>Группа<select id="groupSelect"></select></label>
          <label>Подгруппа<select id="subgroupSelect"></select></label>
        </div>
        <div class="row modes">
          <button class="btn on" id="selectedTime" aria-pressed="true">Выбранное время</button>
          <button class="btn" id="currentTime" aria-pressed="false">Сейчас</button>
        </div>
        <div class="schedule-fields">
          <label>День<input id="scheduleDate" type="date" required></label>
          <label>Время<input id="scheduleTime" type="time" required></label>
        </div>
        <label class="period-label">Демо-интервал<select id="periodSelect" aria-label="Демо-интервал"></select></label>
        <div class="small muted" id="scheduleContext" role="status" aria-live="polite"></div>
        <details id="sourceDetails" hidden><summary>Источник и состояние данных</summary><div id="sourceStatus"></div><label class="period-label">API origin<input id="apiBaseInput" type="url" aria-label="API origin"></label><button class="btn small" id="applyApiBase" type="button">Применить API</button><p class="small" id="apiConfigError" role="status"></p></details>
      </div>
      <div id="scheduleSummary" aria-live="polite"></div>
      <div id="panel"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="map-data.js"></script>
<script src="room-contract.js"></script>
<script src="room-identification.js"></script>
<script src="schedule-engine.js"></script>
<script src="schedule-fixture.js"></script>
<script src="map-semantics.js"></script>
<script src="schematic-layout.js"></script>
<script src="timetable-room-policy.js"></script>
<script src="timetable-adapter.js"></script>
<script src="timetable-api.js"></script>
<script src="timetable-ui.js"></script>
<script>
(function () {
  "use strict";
  var DATA = window.FCIM_MAP_DATA;
  var SVGNS = "http://www.w3.org/2000/svg";
  var STORE_KEY = "fcim-indoor-map/" + DATA.id + "/bindings";
  var STORE_SCHEMA = 1;
  var BUILDING_PREFIX = "3";
  var parseRoomInput = window.FCIM_ROOM_CONTRACT.createParser(DATA, BUILDING_PREFIX);
  var fixture = window.FCIM_SCHEDULE_FIXTURE;
  var roomCatalog = window.FCIM_ROOM_IDENTIFICATION.createCatalog(DATA, parseRoomInput);
  var resolveRoom = window.FCIM_ROOM_CONTRACT.createResolver(DATA, parseRoomInput, roomCatalog);
  var timetablePolicy = window.FCIM_TIMETABLE_ROOM_POLICY.createPolicy(DATA, parseRoomInput, resolveRoom);
  var live = null, scheduleClock = null;
  var facilityLayer = window.FCIM_MAP_SEMANTICS.facilities(DATA, roomCatalog);

  // ---------- индексы данных ----------
  var floorsByLevel = Object.create(null), spaceById = Object.create(null), vertById = Object.create(null);
  DATA.floors.forEach(function (f) {
    floorsByLevel[f.level] = f;
    f.spaces.forEach(function (s) { spaceById[s.id] = s; });
    f.geometry.verticals.forEach(function (v) { vertById[v.id] = Object.assign({}, v, { floorId: f.id }); });
  });
  var westernStair=vertById["B3-F1-STW"];
  vertById["B3-F1-STW-INNER"]=Object.assign({},westernStair,{id:"B3-F1-STW-INNER",type:"elevator",polygon:westernStair.innerShaft,innerShaft:null});
  var allFloorEntries = DATA.floors.map(function (f) { return { level: f.level, label: f.label, short: String(f.level), ready: true }; })
    .concat(DATA.plannedFloors.map(function (p) { return { level: p.level, label: p.label, short: p.level < 0 ? "D" : String(p.level), ready: false, notes: p.notes }; }))
    .sort(function (a, b) { return b.level - a.level; });

  // ---------- состояние ----------
  var state = {
    level: DATA.floors[0].level,
    selected: null,          // id помещения или вертикали
    edit: false,
    msg: null,
    view: null
  };

  var schedule = { source: "demo", courseYear: 1, mode: "my", group: fixture.groups[0].id, subgroup: "", timeMode: "selected", date: fixture.initialSelection.date,
    time: fixture.initialSelection.time, evaluation: null, occupancy: [], focus: [], focusLocations: [], upcoming: false };

  // ---------- хранилище привязок ----------
  function isRecord(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function owns(v, k) { return Object.prototype.hasOwnProperty.call(v, k); }
  function validSpaceId(id) { return typeof id === "string" && owns(spaceById, id); }
  function emptyStore() { return { schemaVersion: STORE_SCHEMA, buildingId: DATA.id, mapDataVersion: DATA.dataVersion, bindings: Object.create(null) }; }
  function versionErrors(st, importing) {
    var errors = [];
    if (!isRecord(st)) return ["Ожидается объект"];
    if (st.schemaVersion !== STORE_SCHEMA) errors.push("Неподдерживаемая schemaVersion");
    if (st.buildingId !== DATA.id) errors.push("Несовместимый buildingId");
    if (st.mapDataVersion !== DATA.dataVersion) errors.push("Несовместимый mapDataVersion");
    if ((importing || owns(st, "mapSchemaVersion")) && st.mapSchemaVersion !== DATA.schemaVersion) errors.push("Несовместимый mapSchemaVersion");
    return errors;
  }
  // Единый валидатор для формы, импорта и хранилища. Исключение этажа требует подтверждения.
  function validateBinding(b, id, allowFloorOverride) {
    if (!isRecord(b)) throw new Error("Запись должна быть объектом");
    if (!validSpaceId(id) || b.spaceId !== id) throw new Error("Недопустимый или отсутствующий spaceId");
    var s = spaceById[id], lvl = levelOfFloorId(s.floorId);
    if (s.kind !== "room") throw new Error("Холлы и проходы не получают номеров аудиторий");
    if (typeof b.roomNumber !== "string") throw new Error("roomNumber должен быть строкой");
    var p = parseRoomInput(b.roomNumber);
    if (!p.ok) throw new Error(p.error);
    if (p.basement) throw new Error("Это помещение подвала; план подвала ещё не добавлен");
    if (owns(b, "floorId") && b.floorId !== s.floorId) throw new Error("floorId не совпадает с помещением");
    if (owns(b, "floorLevel") && b.floorLevel !== lvl) throw new Error("floorLevel не совпадает с помещением");

    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  document.getElementById("exportBtn").onclick = function () {
    var list = Object.keys(store.bindings).sort().map(function (id) {
      var b = store.bindings[id], s = spaceById[id], bb = bbox(s.polygon);
      return { spaceId: id, floorId: s.floorId, floorLevel: b.floorLevel, roomNumber: b.roomNumber, fullNumber: b.fullNumber,
        method: b.method || "manual", updatedAt: b.updatedAt, spaceCentroid: [Math.round(bb.cx * 10) / 10, Math.round(bb.cy * 10) / 10],
        ...(b.floorOverride ? { floorOverride: true } : {}) };
    });
    var payload = { format: "fcim-indoor-map/room-bindings", schemaVersion: STORE_SCHEMA, buildingId: DATA.id,
      mapSchemaVersion: DATA.schemaVersion, mapDataVersion: DATA.dataVersion, exportedAt: new Date().toISOString(),
      count: list.length, bindings: list };
    downloadText(JSON.stringify(payload, null, 2), "fcim-b3-room-bindings-" + new Date().toISOString().slice(0, 10) + ".json", "application/json");
    toast(list.length ? "Экспортировано привязок: " + list.length : "Привязок пока нет — экспортирован пустой файл.");
  };
  function previewImport(j) {
    var errors = versionErrors(j, true), records = [], ids = Object.create(null), numbers = Object.create(null);
    var additions = [], updates = [], transfers = [], conflicts = [], floors = [];
    if (!isRecord(j) || j.format !== "fcim-indoor-map/room-bindings") errors.push("Неподходящий формат файла");
    if (!isRecord(j) || !Array.isArray(j.bindings)) errors.push("bindings должен быть массивом");
    else j.bindings.forEach(function (b, i) {
      var tag = "Запись " + (i + 1) + (isRecord(b) ? " (" + String(b.spaceId) + ")" : "");
      try {
        var c = validateBinding(b, isRecord(b) ? b.spaceId : null, true);
        var sourceError = roomCatalog.checkNewBinding(c.spaceId, c.roomNumber);
        if (sourceError) throw new Error(sourceError);
        if (owns(ids, c.spaceId)) throw new Error("Повтор spaceId " + c.spaceId);
        if (owns(numbers, c.roomNumber)) throw new Error("Повтор канонического номера " + c.fullNumber);
        ids[c.spaceId] = true; numbers[c.roomNumber] = c.spaceId; records.push(c);
        var old = bindingOf(c.spaceId), description = c.spaceId + ": " + (old ? old.fullNumber + " → " : "") + c.fullNumber;
        (old ? updates : additions).push(description);
        if (old && old.roomNumber !== c.roomNumber) conflicts.push("Замена " + description);
        if (c.floorOverride) floors.push(c.spaceId + " → " + c.fullNumber + ": номер указывает на " + parseRoomInput(c.roomNumber).floorGuess + " этаж, помещение — на " + c.floorLevel);
      } catch (e) { errors.push(tag + ": " + e.message); }
    });
    var candidate = copyStore();
    records.forEach(function (c) {
      manualFindByNumber(c.roomNumber).filter(function (id) { return id !== c.spaceId; }).forEach(function (id) {
        var transfer = c.fullNumber + ": " + id + " → " + c.spaceId;
        transfers.push(transfer); conflicts.push("Перенос " + transfer);
        delete candidate.bindings[id];
      });
    });
    records.forEach(function (c) { candidate.bindings[c.spaceId] = c; });
    var checked = validateStore(candidate);
    errors = errors.concat(checked.errors);
    var summary = "Добавления: " + additions.length + "; обновления: " + updates.length + "; переносы: " + transfers.length +
      "; конфликты: " + conflicts.length + "; отклонено: " + errors.length + ".";
    var details = [].concat(additions.map(function (s) { return "Добавление " + s; }), updates.map(function (s) { return "Обновление " + s; }), conflicts, floors, errors);
    return { candidate: checked.store, errors: errors, floors: floors, summary: summary, details: details, count: records.length };
  }
  function importBindings(j) {
    var preview = previewImport(j);
    state.msg = { kind: preview.errors.length ? "err" : "warn", html: "<b>Предпросмотр импорта</b><br>" + esc(preview.summary) +
      "<details open><summary>Изменения и отклонённые записи</summary><ul>" + preview.details.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></details>" };
    renderPanel(); expandSheet();
    if (preview.errors.length) { toast("Ошибка импорта: файл отклонён целиком. " + preview.summary); return; }
    if (!preview.count) { toast("Пустой импорт. " + preview.summary); return; }
    if (!confirm("Импорт — " + preview.summary + "\n" + preview.details.join("\n") + "\nПрименить все перечисленные изменения и переносы?")) {
      state.msg.html += "<br>Импорт отменён; привязки сохранены."; renderPanel(); return;
    }
    if (preview.floors.length && !confirm("Исключения этажей (сохранятся как floorOverride):\n" + preview.floors.join("\n") + "\nПодтвердить эти исключения отдельно?")) {
      state.msg.html += "<br>Импорт отменён; привязки сохранены."; renderPanel(); return;
    }
    // Единственная запись в storage; при ошибке активный набор остаётся прежним.
    if (!saveStore(preview.candidate, false)) { state.msg.kind = "err"; state.msg.html += "<br>Импорт не применён: ошибка сохранения."; renderPanel(); return; }
    state.msg = { kind: "ok", html: "Импортировано: " + preview.count + ". " + esc(preview.summary) };
    refreshClasses(); renderLabels(); renderBadge(); renderPanel(); toast("Импортировано: " + preview.count);
  }
  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = function () { importFile.value = ""; importFile.click(); };
  importFile.onchange = function () {
    var file = importFile.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        importBindings(JSON.parse(rd.result));
      } catch (err) { toast("Ошибка импорта: " + err.message); }
    };
    rd.onerror = function () { toast("Ошибка импорта: не удалось прочитать файл"); };
    rd.readAsText(file);
  };

  // ---------- расписание: state -> evaluation -> room resolution -> highlight ----------
  function demoResolve(lesson) {
    if (live && live.real()) return timetablePolicy.locate(lesson, manualRecords());
    var location = resolveRoom(lesson, { demoAssociations: fixture.demoAssociations });
    var ids=location.spaceIds || (location.spaceId ? [location.spaceId] : []);
    var partial=ids.some(function (id) { var r=roomCatalog.roomForSpace(id); return r && r.spaceIds.length > 1 && JSON.stringify(r.spaceIds.slice().sort()) !== JSON.stringify(ids.slice().sort()); });
    if (partial || ids.some(function (id) { return !roomCatalog.classroomCandidate(id); })) return Object.assign({}, location, { spaceId: null, spaceIds:[], primarySpaceId:null, floorLevel: null, status: "invalid-binding" });
    return location;
  }
  function isMyLesson(lesson) { return (live && live.real() ? lesson.courseYear === schedule.courseYear && lesson.groups.includes(schedule.group) : lesson.group === schedule.group) && (!schedule.subgroup || !lesson.subgroup || lesson.subgroup === schedule.subgroup); }
  function scheduleClasses(id) {
    if (roomCatalog.identity(id)) return "";
    var active = schedule.occupancy.filter(function (o) { return locationContains(o,id); })[0];
    if (active && (schedule.mode === "all" || active.lessons.some(isMyLesson))) {
      return (active.lessons.some(isMyLesson) ? " scheduled-mine" : " scheduled-other") + (active.lessons.length > 1 ? " schedule-shared" : "");
    }
    if (schedule.mode === "my" && schedule.upcoming && schedule.focusLocations.some(function (o) { return locationContains(o,id); })) return " schedule-next";
    return "";
  }
  var LOCATION_MESSAGES = {
    unmapped: "Расположение ещё не нанесено · Location not mapped yet",
    "missing-room": "Аудитория не указана; подсветка отсутствует",
    "outside-building": "Другой корпус; на карте корпуса 3 не отображается",
    "unknown-building": "Корпус неизвестен; расположение не назначается",
    "pending-floor": "План этажа ещё не добавлен · Location not mapped yet",
    "invalid-room": "Некорректный код аудитории; расположение неизвестно",
    "ambiguous-binding": "Конфликт привязок; расположение не выбирается",
    "invalid-binding": "Привязка не соответствует помещению",
    "unverified-binding": "Расположение не подтверждено проверенной привязкой"
  };
  function lessonHtml(lesson, date) {
    var location = demoResolve(lesson);
    return "<div class='lesson' data-lesson-id='" + esc(lesson.id) + "'><b>" + esc(lesson.subject) + "</b><p>" + esc(lesson.group) +
      (lesson.subgroup ? " · подгруппа " + esc(lesson.subgroup) : " · вся группа") + "</p><p>" + esc(date || schedule.date) + " · " + esc(lesson.startTime) + "–" + esc(lesson.endTime) + "</p>" +
      (lesson.teacher ? "<p>" + esc(lesson.teacher) + "</p>" : "<p class='muted'>Преподаватель не указан</p>") +
      "<p>Аудитория: <b>" + esc(location.roomCode || "не указана") + "</b></p>" +
      (location.spaceId ? "<button class='btn small' data-schedule-space='" + esc(location.spaceId) + "'>Показать · " + location.floorLevel + " этаж</button>" : "<p class='msg warn'>" + esc(LOCATION_MESSAGES[location.status] || LOCATION_MESSAGES.unmapped) + "</p>") +
      "<p class='small muted'>" + (lesson.source === "mock" ? "Синтетические данные · временная демо-привязка" : "Опубликованное расписание · не посещаемость") + "</p></div>";
  }
  function wireScheduleLinks(container) {
    Array.prototype.forEach.call(container.querySelectorAll("[data-schedule-space]"), function (button) {
      button.onclick = function () { selectSpace(button.getAttribute("data-schedule-space"), { flash: true }); };
    });
  }
  function scheduledSpaceHtml(id) {
    if (live && live.real()) return "";
    if (roomCatalog.identity(id)) return "";
    var occupants = schedule.occupancy.filter(function (o) { return locationContains(o,id); });
    var h = "<div class='schedule-room'><b>План занятий на выбранное время</b>";
    if (!occupants.length) h += "<p class='small muted'>Нет известного занятия. Покрытие демо неполное; доступность помещения неизвестна.</p>";
    occupants.forEach(function (o) {
      h += "<p><b>" + esc(o.roomCode) + "</b> · синтетический номер, физически не проверен</p>";
      if (o.lessons.length > 1) h += "<div class='msg warn'>Несколько записей в одном помещении: общий слот или возможный конфликт. Все записи сохранены.</div>";
      h += o.lessons.map(function (l) { return lessonHtml(l); }).join("");
    });
    if (schedule.mode === "my" && schedule.upcoming) schedule.focus.forEach(function (entry) {
      if (locationContains(demoResolve(entry.lesson),id)) h += "<p class='small'>Следующее занятие, не активное сейчас:</p>" + lessonHtml(entry.lesson, entry.date);
    });
    return h + "</div>";
  }
  function renderScheduleSummary() {
    if (live && live.real()) { live.render(); return; }
    var e = schedule.evaluation, h = "<div class='card'><h3>" + (schedule.mode === "my" ? "Моя группа · " + esc(schedule.group) : "Все занятия · корпус 3") + "</h3>";
    if (e.contextStatus === "outside-coverage") h += "<div class='msg warn'>Дата вне заданного периода демо. Записей для неё нет.</div>";
    else if (e.contextStatus === "invalid") h += "<div class='msg warn'>Выберите корректные день и время. Контекст расписания недоступен.</div>";
    if (schedule.mode === "my") {
      if (!e.groupActive.length) h += "<p class='small'>Нет активного занятия по доступным данным.</p>";
      if (schedule.upcoming) h += "<p class='small'><b>Следующее занятие</b> · пунктир на карте</p>";
      h += schedule.focus.map(function (entry) { return lessonHtml(entry.lesson, entry.date); }).join("");
      if (!schedule.focus.length) h += "<p class='small muted'>Следующее занятие в заданном периоде не найдено.</p>";
    } else {
      var visible = e.active.filter(function (l) { return demoResolve(l).status !== "outside-building"; });
      h += "<p class='small'>Записей на это время: " + visible.length + ". На карте этого этажа: " + schedule.occupancy.filter(function (o) { return o.spaceId && o.floorLevel === state.level; }).length + ".</p>";
      h += visible.map(function (l) { return lessonHtml(l); }).join("");
      if (!visible.length) h += "<p class='small muted'>Нет известных занятий. Это не означает, что аудитории свободны.</p>";
      var outside = e.active.length - visible.length;
      if (outside) h += "<p class='small muted'>Записей другого корпуса, исключённых из карты: " + outside + ".</p>";
    }
    if (e.issues.length) h += "<details><summary>Неполные или конфликтующие записи: " + e.issues.length + "</summary><ul>" + e.issues.map(function (issue) { return "<li>" + esc(issue.id || "Без ID") + ": " + esc(issue.message) + "</li>"; }).join("") + "</ul></details>";
    h += "<div class='small muted'>Покрытие синтетическое и неполное. Подсветка показывает план, а не физическое присутствие.</div></div>";
    var summary = document.getElementById("scheduleSummary"); summary.innerHTML = h; wireScheduleLinks(summary);
    document.getElementById("scheduleContext").textContent = schedule.date + " " + schedule.time + " · Europe/Chisinau" +
      (e.week ? " · демо-неделя " + e.week.number + " (" + (e.week.parity === "odd" ? "нечётная" : "чётная") + ")" : " · чётность неизвестна") + ". Контекст вымышленный.";
  }
  function updateSchedule(autoSelect) {
    if (schedule.timeMode === "current") {
      var local = window.FCIM_SCHEDULE.localTime(Date.now(), fixture.context.timeZone);
      schedule.date = local.date; schedule.time = local.time;
    }
    document.getElementById("scheduleDate").value = schedule.date;
    document.getElementById("scheduleTime").value = schedule.time;
    schedule.evaluation = live && live.real() ? live.evaluate() : window.FCIM_SCHEDULE.evaluate(fixture, schedule);
    schedule.occupancy = window.FCIM_SCHEDULE.aggregate(schedule.evaluation.active, demoResolve).rooms;
    schedule.upcoming = !(live && live.real()) && !schedule.evaluation.groupActive.length && schedule.evaluation.next.length > 0;
    schedule.focus = schedule.upcoming ? schedule.evaluation.next : schedule.evaluation.groupActive.map(function (lesson) { return { date: schedule.date, lesson: lesson }; });
    schedule.focusLocations = schedule.focus.map(function (entry) { return demoResolve(entry.lesson); });
    if (autoSelect && schedule.mode === "my" && !state.edit) {
      var first = schedule.focusLocations.filter(function (location) { return location.spaceId; })[0];
      if (first) selectSpace(first.spaceId, { revealPanel: false });
      else { state.selected = null; state.msg = null; }
    }
    refreshClasses(); renderLabels(); renderScheduleSummary(); renderPanel();
    var period = fixture.periods.findIndex(function (p) { return p.startTime === schedule.time; });
    document.getElementById("periodSelect").value = period < 0 ? "" : String(period);
  }
  function setTimeMode(mode) {
    schedule.timeMode = mode;
    ["scheduleDate", "scheduleTime", "periodSelect"].forEach(function (id) { document.getElementById(id).disabled = mode === "current"; });
    ["selectedTime", "currentTime"].forEach(function (id) { var on = id === (mode === "current" ? "currentTime" : "selectedTime"), button = document.getElementById(id); button.classList.toggle("on", on); button.setAttribute("aria-pressed", String(on)); });
    updateSchedule(true);
  }
  function initScheduleControls() {
    var groups = document.getElementById("groupSelect"), subgroups = document.getElementById("subgroupSelect");
    groups.innerHTML = fixture.groups.map(function (group) { return "<option value='" + esc(group.id) + "'>" + esc(group.id) + " · курс " + group.courseYear + "</option>"; }).join("");
    function fillSubgroups() {
      var group = fixture.groups.filter(function (g) { return g.id === schedule.group; })[0];
      subgroups.innerHTML = "<option value=''>Все подгруппы</option>" + group.subgroups.map(function (subgroup) { return "<option>" + esc(subgroup) + "</option>"; }).join("");
      subgroups.disabled = !group.subgroups.length;
    }
    fillSubgroups();
    groups.onchange = function () { schedule.group = groups.value; schedule.subgroup = ""; if (live && live.real()) live.fillSubgroups(); else fillSubgroups(); updateSchedule(true); };
    subgroups.onchange = function () { schedule.subgroup = subgroups.value; updateSchedule(true); };
    ["my", "all"].forEach(function (mode) {
      document.getElementById(mode + "Mode").onclick = function () {
        schedule.mode = mode;
        ["my", "all"].forEach(function (m) { var button = document.getElementById(m + "Mode"); button.classList.toggle("on", m === mode); button.setAttribute("aria-pressed", String(m === mode)); });
        if (live && live.real()) live.load(false); else updateSchedule(true);
      };
    });
    document.getElementById("currentTime").onclick = function () { setTimeMode("current"); };
    document.getElementById("selectedTime").onclick = function () { setTimeMode("selected"); };
    document.getElementById("scheduleDate").onchange = function () { schedule.date = this.value; updateSchedule(true); };
    document.getElementById("scheduleTime").onchange = function () { schedule.time = this.value; updateSchedule(true); };
    document.getElementById("periodSelect").innerHTML = "<option value=''>Произвольное время</option>" + fixture.periods.map(function (p, i) { return "<option value='" + i + "'>" + p.startTime + "–" + p.endTime + "</option>"; }).join("");
    document.getElementById("periodSelect").onchange = function () { if (this.value !== "") { schedule.time = fixture.periods[Number(this.value)].startTime; updateSchedule(true); } };
    if (!scheduleClock) scheduleClock = setInterval(function () {
      if (schedule.timeMode !== "current") return;
      var local = window.FCIM_SCHEDULE.localTime(Date.now(), fixture.context.timeZone);
      if (local.date !== schedule.date || local.time !== schedule.time) updateSchedule(true);
    }, 15000);
  }

  // ---------- уведомления ----------
  var toastTimer;
  function toast(t) { var e = document.getElementById("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.classList.remove("show"); }, 3200); }

  // ---------- старт ----------
  var startLevel = parseInt((location.hash.match(/floor=(-?\d+)/) || [])[1], 10);
  initScheduleControls();
  schedule.source = location.protocol === "file:" ? "demo" : "real";
  live = window.FCIM_TIMETABLE_UI.createController({ schedule: schedule, policy: timetablePolicy, bindings: manualRecords, update: updateSchedule, selectSpace: selectSpace,
    initDemo: function () { schedule.group = fixture.groups[0].id; schedule.subgroup = ""; schedule.date = fixture.initialSelection.date; schedule.time = fixture.initialSelection.time; document.getElementById("groupSelect").disabled = false; initScheduleControls(); } });
  if (live.real()) { var initialLocal = window.FCIM_SCHEDULE.localTime(Date.now(), "Europe/Chisinau"); schedule.date = initialLocal.date; schedule.time = initialLocal.time; schedule.group = ""; }
  updateSchedule(false);
  setLevel(floorsByLevel[startLevel] ? startLevel : 4);
  if (!floorsByLevel[startLevel]) updateSchedule(true);
  if (live.real()) live.load(false);
  window.addEventListener("hashchange", function () { var m = location.hash.match(/floor=(-?\d+)/); if (m && floorsByLevel[+m[1]]) setLevel(+m[1]); });
  // минимальный API для отладки/будущей интеграции
  window.FCIM_MAP_APP = { selectSpace: selectSpace, setLevel: setLevel, parseRoomInput: parseRoomInput, getBindings: function () { return JSON.parse(JSON.stringify(store)); },
    getScheduleState: function () { return JSON.parse(JSON.stringify(schedule)); },
    getLogicalSelection: function () { var r=roomCatalog.roomForSpace(state.selected); return {roomCode:r ? r.roomCode : null,spaceIds:selectedIds(),clickedSpaceId:state.selected}; },
    getFacilities: function () { return JSON.parse(JSON.stringify(facilityLayer)); } };
})();
</script>
